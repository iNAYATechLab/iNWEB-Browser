  - id: 0016-extension-action-surfaces
    file: extension/0016-extension-action-surfaces.patch
    area: extension
    description: >-
      Closes Chromium's existing Android extension management, toolbar action,
      popup and options surfaces by default. A device-verification run may opt
      in with --enable-inweb-extension-ui; normal builds expose nothing merely
      because the experimental backend compiled.
    upstream_files:
      - chrome/browser/ui/android/extensions/java/src/org/chromium/chrome/browser/ui/extensions/ExtensionUiBackendImpl.java
    risk: medium
    validation: >-
      Patch apply/reverse/re-apply and authored structural scan; Chromium Java
      compilation; device tests with and without the explicit switch. Without
      the switch the Extensions app-menu item and toolbar surfaces must remain
      absent.
    rebase_notes: >-
      Upstream may replace ExtensionUiBackendImpl or add a stable feature
      gate. Preserve the default-closed behavior and migrate to the supported
      upstream gate instead of carrying a duplicate switch.

  - id: 0017-extension-policy-gate
    file: extension/0017-extension-policy-gate.patch
    area: extension
    description: >-
      Deterministic sideload/update policy gate: invalid and non-newer packages
      are blocked; every first install requires explicit review; permission-
      expanding updates cannot enable before renewed review; and MV2 packages
      carry a deprecation-warning signal. The gate stages decisions only and
      makes no runtime capability claim.
    upstream_files:
      - chrome/android/inweb/extensions/BUILD.gn
      - chrome/android/inweb/extensions/inweb_extension_policy.cc
      - chrome/android/inweb/extensions/inweb_extension_policy.h
      - chrome/android/inweb/extensions/inweb_extension_policy_unittest.cc
    risk: medium
    validation: >-
      Five focused native policy tests plus eleven installer/archive tests;
      independent and cumulative patch round-trip; GN validation; Chromium
      native unit tests. Runtime wiring remains unavailable until the build/API
      audit and on-device permission/disable/remove matrix are green.
    rebase_notes: >-
      Keep policy evaluation side-effect free. Any future bridge to Chromium's
      ExtensionService must stage disabled first and preserve upstream
      permission-warning and upgrade-consent semantics.
