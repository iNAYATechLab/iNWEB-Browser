  - id: 0008-popup-window-guard
    file: popup_protection/0008-popup-window-guard.patch
    area: popup_protection
    description: >-
      Popup window guard (PHASE4-POPUP §2A, first real call site for the
      $popup rule type): InwebPopupGuard decides at the Android
      WebContentsDelegate window-open consent point
      (TabWebContentsDelegateAndroid::AddNewContents). Without a user
      gesture a popup is blocked by default (Chrome-parity browser
      policy) unless the opener site is allowlisted or an @@ exception
      matches; with a gesture the native engine's $popup / host rules
      still block tracker popups. The engine is consulted with
      ResourceType::kPopup through the process-wide holder; the holder
      gains IsSiteAllowlisted (single shields list = popup exemption
      list). Blocked popups set the standard was_blocked signal
      (content-side popup-blocked UI path) and count into real §24
      counters (blocked_popup_count / engine_blocked_count; zero until
      real events). Hooks: chrome/browser/android BUILD.gn target
      "android" gains the inweb_popup_guard dep; chrome/test BUILD.gn
      gains :unittests; the guard block + include in
      tab_web_contents_delegate_android.cc. The blocked-popup UI chip +
      open-once flow is a later UI patch (guard exposes the counters).
    upstream_files:
      - chrome/browser/android/BUILD.gn
      - chrome/browser/android/tab_web_contents_delegate_android.cc
      - chrome/test/BUILD.gn
    risk: medium
    validation: >-
      Host harness (scripts/native_harness): 79/79 tests pass (73 adblock
      + 6 popup guard: default-deny gestureless, gesture-allow,
      allowlist exemption, @@ exception, engine-block-with-gesture,
      production-decider $popup rule through the real holder). The
      harness caught two real defects pre-build (missing bind.h include;
