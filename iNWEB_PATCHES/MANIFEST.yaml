    description: >-
      Prepared management/install layer: adds the host-tested CRX3/ZIP
      structural inspector, manifest/version validation and native tests;
      builds them in Chromium; retains upstream Manage Extensions surfaces;
      and removes the Chrome Web Store app-menu item so discovery is not
      misrepresented as a supported installation path. UI remains gated.
    upstream_files:
