  - id: 0014-extension-enable-android
    file: extension/0014-extension-enable-android.patch
    area: extension
    description: >-
      Compile-time opt-in for Chromium's existing experimental Android
      extension core through a dedicated enable_inweb_android_extensions GN
      argument, plus the artifact-based API audit tool. This is a high-risk
      build probe, not an availability claim: extension UI remains closed by
      0016 until explicit device verification.
    upstream_files:
      - extensions/buildflags/buildflags.gni
      - chrome/android/inweb/extensions/tools/audit_extension_apis.py
    risk: high
    validation: >-
      Security review boundary: does not enable the full desktop extension
      flag, exposes no UI by itself, and reports no supported API without APK
      evidence. Independent patch apply/reverse/re-apply, manifest/GN lint,
      then a pinned Chromium build hop and artifact API audit are required.
    rebase_notes: >-
      Re-check enable_desktop_android_extensions and enable_extensions_core at
      the pinned baseline. If upstream removes or stabilizes the experimental
      path, prefer its supported Android switch and retire the iNWEB argument.

