      - chrome/android/inweb/extensions/inweb_extension_installer_unittest.cc
      - chrome/android/java/src/org/chromium/chrome/browser/app/appmenu/AppMenuPropertiesDelegateImpl.java
      - chrome/browser/BUILD.gn
      - chrome/test/BUILD.gn
    risk: medium
    validation: >-
      Sixteen extension native tests in the focused host harness after 0017;
      eleven installer/archive tests independently at this patch boundary;
      patch apply/reverse/re-apply; GN label validation; Chromium compile and
      upstream Android extension tests required before exposure.
    rebase_notes: >-
      The app-menu hunk removes only the Web Store submenu row. Re-check
