# =============================================================================
# iNWEB Browser — Patch Registry (MANIFEST.yaml)
# =============================================================================
# This file is the SINGLE AUTHORITY for every iNWEB modification applied to
# upstream Chromium. The working tree on build infrastructure must always be
# reproducible as:
#
#     pristine upstream Chromium @ pinned tag  +  this ordered patch series
#
# Rules (enforced by scripts/lint_manifest.py and CI):
#   * entries are applied strictly in listed order
#   * id and file name use the form NNNN-slug (NNNN = 4-digit order prefix)
#   * file must live under its area directory (e.g. privacy/0001-....patch)
#   * ids must be unique; numeric prefixes strictly increasing
#   * every registered file must exist on disk
#
# Entry fields:
#   id            unique identifier "NNNN-slug"
#   file          path relative to iNWEB_PATCHES/
#   area          one of: privacy, security, adblock, popup_protection,
#                 extension, performance, ui, offline, settings
#   description   one-line purpose (professional English)
#   upstream_files  list of upstream files touched (traceability)
#   risk          low | medium | high (high requires a security review note)
#   validation    how the patch is validated (test id / procedure)
#   rebase_notes  free-form notes for future rebases
# =============================================================================

schema_version: 1

# The series is intentionally EMPTY at Phase 1: no patch ships until it has been
# generated against the real pinned source and validated (MASTER-SPEC §57).
patches:
  # ---------------------------------------------------------------------------
  # iNWEB patch series — applied in order to the pristine pinned baseline.
  # Authored against the real pinned tag 154.0.8037.21 (file contents fetched
  # from the tag; diff round-trip validated: apply / reverse / re-apply).
  # ---------------------------------------------------------------------------
  - id: 0001-app-identity
    file: ui/0001-app-identity.patch
    area: ui
    description: >-
      Application identity: user-visible launcher and widget names rebranded
      from Chromium to iNWEB (app_name, bookmark/search/quick-action widget
      titles) per ADR-038 (launcher name "iNWEB"; full product name
      "iNWEB Browser" per master prompt #1).
    upstream_files:
      - chrome/android/java/res_chromium_base/values/channel_constants.xml
    risk: low
    validation: >-
      Local round-trip (git apply / --reverse / re-apply) on the file fetched
      from the pinned tag; b001-verify (patches mode) apply+verify on a real
      fetched tree; incremental build smoke check at Stage-2 build time.
    rebase_notes: >-
      channel_constants.xml moved from res/values to res_chromium_base/values
      in recent Chromium; on rebase, re-check the path and the string list.
  - id: 0002-in-app-strings
    file: ui/0002-in-app-strings.patch
    area: ui
    description: >-
      In-app self-identification strings rebranded: 212 messages in
      android_chrome_strings.grd change literal Google Chrome / Chrome /
      Chromium in displayed text to iNWEB. Third-party compound names are
      deliberately preserved (Chrome Web Store, Chromebook, ChromeOS,
      Chromecast, Chrome Remote Desktop, Gemini-in-Chrome promo strings,
      Google legal document titles) - 17 messages skipped. Message IDs and
      desc attributes unchanged (code references intact).
    upstream_files:
      - chrome/browser/ui/android/strings/android_chrome_strings.grd
    risk: low
    validation: >-
      Script-assisted rebrand with exclusion rules; git apply/--reverse
      round-trip; apply_patches.py E2E (apply, verify, PEEL-idempotence);
      b001-verify (patches mode) on a real fetched tree. KNOWN EFFECT:
      changed English source text invalidates upstream .xtb translations
      for these messages until iNWEB provides its own localized strings
      (planned) - affected strings fall back to English in non-en locales.
    rebase_notes: >-
      Mechanical rebrand; on rebase, re-run the same rules (Google Chrome ->
      iNWEB, Chrome -> iNWEB, Chromium -> iNWEB outside <ex>, with the
      exclusion list) against the new grd. Promo strings tied to Google
      services may be removed entirely by later privacy/security patches.
  - id: 0003-launcher-icons
    file: ui/0003-launcher-icons.patch
    area: ui
    description: >-
      iNWEB launcher icon set (v1 logo, user-selected): replaces all 15
      launcher icon assets in res_chromium_base (app_icon.png legacy
      round icon at 48/72/96/144/192 px; layered_app_icon.png
      adaptive-foreground and layered_app_icon_background.png
      adaptive-background at 108/162/216/324/432 px per density). Design:
      the user-provided iNWEB logo mark (transparent-background PNG
      master, preserved at assets/logo/inweb_logo_master.png)
      composited over the deep navy-to-teal gradient; legacy icons
      circle-cropped with transparent corners, adaptive foreground
      full-bleed, adaptive background pure gradient. All densities
      derived programmatically (PIL); binary git diff.
    upstream_files:
      - chrome/android/java/res_chromium_base/mipmap-mdpi/app_icon.png
      - chrome/android/java/res_chromium_base/mipmap-hdpi/app_icon.png
      - chrome/android/java/res_chromium_base/mipmap-xhdpi/app_icon.png
      - chrome/android/java/res_chromium_base/mipmap-xxhdpi/app_icon.png
      - chrome/android/java/res_chromium_base/mipmap-xxxhdpi/app_icon.png
      - chrome/android/java/res_chromium_base/mipmap-mdpi/layered_app_icon.png
      - chrome/android/java/res_chromium_base/mipmap-hdpi/layered_app_icon.png
      - chrome/android/java/res_chromium_base/mipmap-xhdpi/layered_app_icon.png
      - chrome/android/java/res_chromium_base/mipmap-xxhdpi/layered_app_icon.png
      - chrome/android/java/res_chromium_base/mipmap-xxxhdpi/layered_app_icon.png
      - chrome/android/java/res_chromium_base/mipmap-mdpi/layered_app_icon_background.png
      - chrome/android/java/res_chromium_base/mipmap-hdpi/layered_app_icon_background.png
      - chrome/android/java/res_chromium_base/mipmap-xhdpi/layered_app_icon_background.png
      - chrome/android/java/res_chromium_base/mipmap-xxhdpi/layered_app_icon_background.png
      - chrome/android/java/res_chromium_base/mipmap-xxxhdpi/layered_app_icon_background.png
    risk: low
    validation: >-
      Exact upstream dimensions and PNG modes reproduced per density; git
      apply/--reverse binary round-trip with byte-identical applied files;
      apply_patches.py E2E (apply, verify, PEEL-idempotence, 3-patch
      series); lint_manifest.py; b001-verify (patches mode) PASS on the
      real fetched tree (run 35749687902, commit 75c71fa) for this
      reworked content; visual acceptance at first iNWEB APK install.
    rebase_notes: >-
      Binary patch - on rebase, regenerate assets from the master
      (assets/logo/inweb_logo_master.png, user-provided v1 logo)
      and re-diff. themed_app_icon.xml (Android 13+ monochrome) is
      rebranded by patch 0004.
  - id: 0004-themed-app-icon
    file: ui/0004-themed-app-icon.patch
    area: ui
    description: >-
      iNWEB monochrome themed app icon (Android 13+): replaces the Chrome
      glyph in res_chromium_base/drawable/themed_app_icon.xml with a
      vector silhouette of the iNWEB v1 logo mark, traced from the master
      (assets/logo/inweb_logo_master.png), simplified (Douglas-Peucker)
      and fitted into the upstream 36x36 safe-zone clip at the center of
      the 90x90 viewport. Upstream vector/group/clip-path structure kept;
      single evenOdd path (2 outer contours + 1 counter), ~2.4 KB
      pathData.
    upstream_files:
      - chrome/android/java/res_chromium_base/drawable/themed_app_icon.xml
    risk: low
    validation: >-
      Trace QA (threshold plateau 0.49-0.53 across 64-192 with constant
      component count; glyph box 28.0,28.8-62.0,61.2 inside the clip
      zone; area coverage 0.51; centroid offset under 1 unit);
      silhouette preview archived at docs/design/assets/
      themed-icon-silhouette-preview.png for author visual acceptance;
      git apply/--reverse round-trip byte-identical; apply_patches.py E2E
      (4-patch series, PEEL idempotence); lint_manifest.py; b001-verify
      PASS on the real tree (run 35749687902, commit 75c71fa).
    rebase_notes: >-
      Small text patch on a rarely-touched vector XML; on logo change,
      re-trace the silhouette from the master with the documented
      pipeline (docs/design/BRAND.md).
  - id: 0005-adblock-engine-native
    file: adblock/0005-adblock-engine-native.patch
    area: adblock
    description: >-
      Native ad-block decision engine (ADR-040): the tested Kotlin
      tracking-protection core ported to C++ under
      chrome/android/inweb/adblock/ — resource types, rule model,
      RE2-based pattern compiler, PSL-backed domain classifier
      (net::registry_controlled_domains), rule matcher, EasyList-family
      subset parser, decision engine with settings and thread-safe
      statistics, plus 4 unit-test files mirroring the Kotlin cases.
      Two one-line upstream hooks (alphabetical deps slots):
      chrome/browser BUILD.gn gains //chrome/android/inweb/adblock:
      inweb_adblock_engine; chrome/test BUILD.gn gains :unittests.
      v1 full-scan decide (combined matcher = patch 0012). Authoring
      sources: src/native/adblock/.
    upstream_files:
      - chrome/browser/BUILD.gn
      - chrome/test/BUILD.gn
    risk: medium
    validation: >-
      Line-by-line port review against the Kotlin reference (920 lines,
      116 tests); unit tests mirror the Kotlin cases (parser
      classification, anchors, options, exceptions, allowlist, decision
      order, statistics); apply_patches.py E2E with byte-identical
      applied files (5-patch series, PEEL idempotence);
      lint_manifest.py; host harness (scripts/native_harness - shimmed
      base/GURL/PSL + real RE2): 36/36 mirrored unit tests pass, two
      port/test defects caught and fixed before any build attempt. Full
      compile + unit tests run in the b001-build-hop chain at the first
      iNWEB APK build.
    rebase_notes: >-
      Two one-line BUILD.gn hook insertions; 18 new files under a new
      directory upstream never touches. On rebase, re-sync from
      src/native/adblock/ and re-diff.
  - id: 0006-adblock-url-loader-throttle
    file: adblock/0006-adblock-url-loader-throttle.patch
    area: adblock
    description: >-
      Wires the native ad-block engine into the network stack (ADR-040):
      InwebAdblockURLLoaderThrottle (blink::URLLoaderThrottle) defers
      each subresource request and redirect, decides on the thread pool
      through the engine holder, then cancels with
      net::ERR_BLOCKED_BY_CLIENT or resumes; RequestDestination to
      ResourceType mapping (workers->script, kEmpty->other, documented
      deviations); engine holder (process singleton, thread-safe) with
      SetFilterLists/UpdateSettings provisioning entry points; engine
      gains UpdateSettings. Registered in
      ChromeContentBrowserClient::CreateURLLoaderThrottles (Android
      only; outermost main frame exempt in v1; no throttle while
      disabled). chrome/browser BUILD.gn gains the :inweb_adblock_throttle
      dep.
    upstream_files:
      - chrome/browser/BUILD.gn
      - chrome/browser/chrome_content_browser_client.cc
    risk: medium
    validation: >-
      Host harness (scripts/native_harness): 49/49 tests pass (36 engine
      + 5 destination map + 4 throttle defer/cancel/resume/redirect +
      4 holder); the harness caught real defects before any build
      attempt (missing bind.h include, holder ctor accessibility).
      apply_patches.py E2E on the 6-patch series with byte-identical
      applied files and PEEL idempotence; lint_manifest.py. Compile +
      unit tests run in the b001-build-hop chain.
    rebase_notes: >-
      Two upstream hunks (chrome/browser BUILD.gn deps slot; ccbc.cc
      android include block + registration before the CreateURLLoader
      Throttles return). Sources re-sync from src/native/adblock/
      (cumulative for the series; this patch is the delta over the
      0005-applied state).
