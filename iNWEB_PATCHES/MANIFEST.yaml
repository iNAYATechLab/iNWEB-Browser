  - id: 0009-popup-redirect-throttle
    file: popup_protection/0009-popup-redirect-throttle.patch
    area: popup_protection
    description: >-
      Tab-takeover / tab-under redirect throttle (PHASE4-POPUP §2B, the
      frame-context rule the engine cannot see): a renderer-initiated
      top-level navigation without user activation (neither gesture nor
      transient activation) is blocked when it was started by an ad
      frame (NavigationHandle::StartedByAd) or by a cross-origin frame
      (GetInitiatorOrigin differs from the main frame's last committed
      origin). Exemptions before blocking: the site the user is on is
      allowlisted (single shields list), or an @@ exception matches the
      target document (engine consulted through the holder with
      ResourceType::kDocument — identity-provider redirect flows). When
      the engine already decides BLOCK the throttle stands down: the
      URL-loader throttle (0006) owns host-based blocking, its counters,
      and redirect re-evaluation (WillRedirectRequest always PROCEEDs
      here). Same-tab same-origin gestureless script redirects and all
      genuine user-activated navigations are never touched
      (web-compatibility, §2B). Blocked takeovers load a script-free
      "redirect blocked" error page (BLOCK_REQUEST +
      net::ERR_BLOCKED_BY_CLIENT + static HTML; localization deferred to
      PHASE10) and count into a real §24 counter
      (blocked_redirect_count; zero until real events). The decision
      core is the pure, harness-tested InwebRedirectGuard; the thin
      content/ wrapper is InwebRedirectThrottle. Hooks:
      chrome_content_browser_client.cc CreateThrottlesForNavigation
      (after CreateAndAddChromeThrottlesForNavigation) + sorted
      include; chrome/browser BUILD.gn deps (after the adblock
      inweb deps). chrome/test BUILD.gn needs no change (the 0008
      popup :unittests dep picks up the new test file).
    upstream_files:
      - chrome/browser/BUILD.gn
      - chrome/browser/chrome_content_browser_client.cc
    risk: medium
    validation: >-
      Host harness (scripts/native_harness): 92/92 tests pass (79 + 13
      redirect guard: subframe-not-ours, browser-initiated proceed,
      same-document/page-activation proceed, user-activation-never-
      touched, gestureless cross-origin block, same-origin gestureless
      proceed, unattributed proceed, started-by-ad blocks even
      same-origin, allowlist exempt, @@ exception exempt through the
      real holder with a $document rule, engine-BLOCK stands down for
      0006, counter counts only real blocks, production decider path).
      The exact NavigationThrottle/NavigationHandle/registry API at the
      pinned tag (registry-based ctor, ThrottleCheckResult with
      error-page content, StartedByAd/StartedWithTransientActivation/
      GetInitiatorOrigin, CreateThrottlesForNavigation signature) was
      verified against the pinned tree (sparse partial clone @154).
      apply_patches E2E on the 9-patch series with byte-identical
      applied files and PEEL idempotence; lint_manifest.py; b001-verify
      (patches mode) PASS on the real fetched tree (run 35770417844,
      commit 3a457fc). Compile + unit tests run in the b001-build-hop
      chain.
    rebase_notes: >-
      Two upstream hunks: chrome_content_browser_client.cc (sorted
      include slot right after the adblock inweb includes; the
      MaybeCreate call after CreateAndAddChromeThrottlesForNavigation
      inside CreateThrottlesForNavigation) and chrome/browser BUILD.gn
      (deps line after //chrome/android/inweb/adblock:inweb_adblock_
      throttle). The "keep the original page" wording in the design doc
      is approximated by the static error page plus the back button —
      NavigationThrottle offers no preserve-document action; documented
      honestly here. Error-page HTML is English-only until PHASE10
      localization. Sources: src/native/popup/ (guard + throttle;
      cumulative over the 0008-applied state).
  - id: 0010-popup-notification-policy
    file: popup_protection/0010-popup-notification-policy.patch
    area: popup_protection
    description: >-
      Abusive-notification quieting policy (PHASE4-POPUP §2C, risk
      "low"): notification permission prompts are quieted by default —
      no modal; the request surfaces as Chromium's existing quiet chip
      (PermissionRequestManager quiet-UI path + the Android quiet
      prompt model, untouched) which the user can expand. Never
      auto-granted: a grant requires an explicit user action on the
      expanded prompt. Repeated-deny auto-blocking stays Chromium's
      PermissionDecisionAutoBlocker (untouched). v1 honest scope: ALL
      ASK-state notification prompts are quieted — the
      engagement-exemption slot exists in the policy core but is
      unwired (no engagement signal fabricated; conservative superset
      of "sites without meaningful engagement"). iNWEB makes NO
      Safe-Browsing-class reputation claim (§2C/§6): quieting is
      policy-based only. The pure InwebNotificationPolicy core owns
      the decision table + a real §24 counter (quieted_prompt_count,
      zero until real events); the thin wrapper
      InwebNotificationPolicyUiSelector (permissions::PermissionUiSelector,
      synchronous, Cancel no-op, kEnabledInPrefs as the honest
      QuietUiReason) is registered FIRST in
      ChromePermissionsClient::CreatePermissionUiSelectors so iNWEB
      policy takes precedence. Hooks: chrome_permissions_client.cc
      (sorted include before chrome/browser/actor/...; selector
      emplace first in the vector) and chrome/browser/permissions
      BUILD.gn (deps line after :permissions_proto).
    upstream_files:
      - chrome/browser/permissions/BUILD.gn
      - chrome/browser/permissions/chrome_permissions_client.cc
    risk: low
    validation: >-
      Host harness (scripts/native_harness): 97/97 tests pass (92 + 5
      notification policy: quieted-by-default, other-permissions
      untouched, engagement-exemption slot wired-but-unset, counter
