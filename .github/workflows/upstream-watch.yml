name: Upstream Watch

# Weekly drift check: compares the pinned Chromium baseline
# (build/config/inweb/BASELINE) against the current upstream Android stable
# via the Chrome Version History API. On drift, opens (or updates) a tracking
# issue so the rebase process of docs/PHASE0-CHROMIUM-BASELINE.md §3 starts.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  issues: write

jobs:
  check-baseline:
    name: Chromium baseline drift check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check pinned baseline against upstream Android stable
        id: baseline
        run: |
          set +e
          python3 scripts/check_baseline.py --json > baseline-report.json
          RC=$?
          set -e
          cat baseline-report.json
          if [ "$RC" = "0" ]; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
          elif [ "$RC" = "1" ]; then
            echo "drift=true" >> "$GITHUB_OUTPUT"
          else
            echo "drift=error" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Open or update drift tracking issue
        if: steps.baseline.outputs.drift == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LATEST=$(python3 -c 'import json; print(json.load(open("baseline-report.json"))["latest"])')
          PINNED=$(python3 -c 'import json; print(json.load(open("baseline-report.json"))["pinned"])')
          TITLE="Upstream Chromium update available: $LATEST (pinned $PINNED)"
          gh label create upstream-update --color D93F0B 2>/dev/null || true
          OPEN_COUNT=$(gh issue list --label upstream-update --state open --json number --jq 'length')
          if [ "$OPEN_COUNT" = "0" ]; then
            gh issue create --title "$TITLE" --label upstream-update --body-file baseline-report.json
          else
            NUM=$(gh issue list --label upstream-update --state open --json number --jq '.[0].number')
            gh issue edit "$NUM" --title "$TITLE" --body-file baseline-report.json
          fi
