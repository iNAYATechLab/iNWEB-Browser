name: CI — Authoring

# Live authoring pipeline (GitHub-hosted runner — not blocked by B-001).
# Validates the patch registry and runs the unit tests for iNWEB tooling.

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - "iNWEB_PATCHES/**"
      - ".github/workflows/ci-authoring.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - "iNWEB_PATCHES/**"
      - ".github/workflows/ci-authoring.yml"

jobs:
  validate:
    name: Unit tests and registry validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tooling dependencies
        run: python3 -m pip install --quiet pyyaml

      - name: Validate patch registry
        run: python3 scripts/lint_manifest.py

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -t . -v
