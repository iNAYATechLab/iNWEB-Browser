name: CI — Authoring

# Live authoring pipeline (GitHub-hosted runner — not blocked by B-001).
# Validates the patch registry, localized string resources, and the pure-JVM
# core module; runs Python and Kotlin unit tests.

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - "iNWEB_PATCHES/**"
      - "src/**"
      - ".github/workflows/ci-authoring.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - "iNWEB_PATCHES/**"
      - "src/**"
      - ".github/workflows/ci-authoring.yml"

jobs:
  python-validation:
    name: Python tests, registry and string validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install tooling dependencies
        run: python3 -m pip install --quiet pyyaml

      - name: Validate patch registry
        run: python3 scripts/lint_manifest.py

      - name: Validate localized string resources
        run: python3 scripts/validate_strings.py
      - name: Validate authored-UI string externalization
        run: python3 scripts/validate_localization.py

      - name: Run Python unit tests
        run: python3 -m unittest discover -s tests -t . -v

  kotlin-core-tests:
    name: Kotlin core tests (multi-module)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Kotlin toolchain
        uses: actions/cache@v6
        with:
          path: ~/.cache/inweb
          key: inweb-kotlin-${{ runner.os }}-v2.4.20

      - name: Compile and run core module tests
        run: bash scripts/validate_kotlin_core.sh
